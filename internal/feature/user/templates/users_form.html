{{ define "content" }}
<h1>{{ .Title }}</h1>
<p class="muted">Emails: satu email per baris (atau dipisah koma).</p>

{{ if .Error }}<div class="alert error">{{ .Error }}</div>{{ end }}

{{ if .Form.ID }}
<form method="post" action="/users/{{ .Form.ID }}">
{{ else }}
<form method="post" action="/users">
{{ end }}
    <input type="hidden" name="_csrf" value="{{ .CSRFToken }}">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{ .Form.Name }}" required>

    <label for="emails">Emails</label>
    <textarea id="emails" name="emails" placeholder="andre@gmail.com">{{ .Form.Emails }}</textarea>

    <div class="actions">
        <button class="btn" type="submit">Save</button>
        <a class="btn secondary" href="/users">Cancel</a>
    </div>
</form>
{{ end }}
